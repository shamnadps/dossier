<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; box-sizing: border-box; }
  html, body { width: 100vw; min-height: 100vh; overflow: hidden; }
  body {
    background: radial-gradient(1200px 700px at 30% 25%, #1e1b4b 0%, #111827 55%, #0b0f1a 100%);
    color: #fff;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    display: flex; flex-direction: column; justify-content: center;
    padding: 0 150px;
  }
  .brand { display: flex; align-items: center; gap: 22px; margin-bottom: 40px; }
  .dot { width: 40px; height: 40px; border-radius: 12px; background: #6366f1; box-shadow: 0 0 40px rgba(99,102,241,.6); }
  .brand h1 { font-size: 72px; letter-spacing: -0.03em; font-weight: 800; }
  .tag { font-size: 42px; font-weight: 600; line-height: 1.25; max-width: 1250px; color: #e5e7eb; }
  .tag .accent { color: #a5b4fc; }
  .sub { margin-top: 34px; font-size: 26px; color: #9ca3af; max-width: 1100px; line-height: 1.5; }
  .chips { margin-top: 60px; display: flex; gap: 16px; }
  .chip {
    font-size: 22px; font-weight: 600; padding: 12px 22px; border-radius: 999px;
    background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.12); color: #d1d5db;
  }
  .chip b { color: #fff; }
</style>
</head>
<body>
  <div class="brand"><div class="dot"></div><h1>Dossier</h1></div>
  <div class="tag">The CRM account page that shows up to the meeting <span class="accent">already briefed</span>.</div>
  <div class="sub">Add a company, hit one button, and the account page reads the live web for you &mdash; a cited brief, ranked buying signals, and a drafted outreach email.</div>
  <div class="chips">
    <div class="chip">Backend&nbsp;<b>Xano</b></div>
    <div class="chip">Live web&nbsp;<b>SerpApi</b></div>
    <div class="chip">Brief&nbsp;<b>Gemini</b></div>
  </div>
</body>
</html>
